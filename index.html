
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>민첩하게 이대까지!</title>

  <!-- 픽셀 스타일 폰트 -->
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Gowun+Dodum&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>

<body>
  <main id="game-container">

    <!-- ===================================
         1. 시작 화면
    =================================== -->
    <section id="start-screen" class="screen">

      <div class="game-label">EWHA RUNNER</div>

      <h1>민첩하게<br>이대까지!</h1>

      <p class="story">
        늦잠을 자버린 이화여대 학생!<br>
        수업 시작까지 단 60초!<br>
        장애물을 피해 학교에 도착하자!
      </p>

      <div class="controls">
        <h2>HOW TO PLAY</h2>

        <p>
          <span class="key">SPACE</span>
          점프 / 2단 점프
        </p>

        <p>
          <span class="key">↓</span>
          숙이기 / 고양이 쓰다듬기
        </p>

        <p>
          <span class="key">♥</span>
          장애물 -20 / 고양이 +5
        </p>
      </div>

      <button id="start-button">
        GAME START
      </button>

    </section>


    <!-- ===================================
         2. 플레이 화면
    =================================== -->
    <section id="play-screen" class="screen hidden">

      <!-- 게임 상단 정보 -->
      <div class="game-header">

        <span>EWHA RUNNER</span>

        <!-- 남은 시간 -->
        <span id="timer">남은 시간: 60초</span>

      </div>

      <!-- HP 표시 -->
      <div class="hp-container">

        <div class="hp-label">
          <span>♥ LIFE</span>
          <span id="hp-text">100 / 100</span>
        </div>

        <div class="hp-bar">
          <div id="hp-fill"></div>
        </div>

      </div>

      <!-- 게임 캔버스 -->
      <canvas
        id="game-canvas"
        width="800"
        height="400"
      ></canvas>

    </section>


    <!-- ===================================
         3. 결과 화면
    =================================== -->
    <section id="result-screen" class="screen hidden">

      <div id="result-card" class="result-card">

        <!-- 성공 / 실패 아이콘 -->
        <div class="result-decoration">
          <span class="pixel-star">✦</span>
          <span id="result-icon">★</span>
          <span class="pixel-star">✦</span>
        </div>

        <!-- 성공 / 실패 상태 -->
        <p id="result-status" class="result-status">
          MISSION CLEAR!
        </p>

        <!-- 결과 제목 -->
        <h2 id="result-title">
          이대 도착 성공!
        </h2>

        <!-- 이화여대 픽셀아트 -->
        <!-- 성공했을 때만 표시 -->
        <div id="ewha-scene" class="ewha-scene hidden">

          <canvas
            id="ewha-canvas"
            width="320"
            height="150"
          ></canvas>

        </div>

        <!-- 결과 설명 -->
        <p id="result-message">
          무사히 학교에 도착했어!
        </p>

        <!-- 남은 HP -->
        <div class="score-board">

          <p class="score-label">
            REMAINING LIFE
          </p>

          <p id="result-hp" class="final-score">
            100 / 100
          </p>

        </div>

        <!-- 재시작 버튼 -->
        <button id="restart-button" class="pixel-button">
          ↻ PLAY AGAIN
        </button>

        <p class="result-footer">
          EWHA RUNNER · ONE MORE CHANCE!
        </p>

      </div>

    </section>

  </main>
</body>
</html>
